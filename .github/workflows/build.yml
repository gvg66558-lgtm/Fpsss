name: Build FPS 120 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          
          # Tự động đồng ý cấp phép SDK
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Cài đặt nền tảng Android 34 và công cụ biên dịch
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle & Generate Wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build FPS 120
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/FPS-120.apk

      - name: Upload FPS 120 APK
        uses: actions/upload-artifact@v4
        with:
          name: FPS-120
          path: output/FPS-120.apk
