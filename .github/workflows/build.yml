name: Auto Build Kryos FPS Overlay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Project and Build APK
      run: |
        # 1. Cài đặt Gradle trên môi trường build
        sudo apt-get update && sudo apt-get install -y gradle

        # 2. Tạo toàn bộ cấu trúc thư mục
        mkdir -p app/src/main/java/com/kryos/fpsoverlay
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/layout

        # 3. Tạo file settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "Kryos FPS Overlay"
        include(":app")
        EOF

        # 4. Tạo file build.gradle.kts (Project)
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
        }
        EOF

        # 5. Tạo file app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.kryos.fpsoverlay"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.kryos.fpsoverlay"
                minSdk = 28
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
        }
        EOF

        # 6. Tạo AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Kryos FPS"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.KryosFPSOverlay">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".OverlayService"
                    android:enabled="true"
                    android:exported="false"
                    android:foregroundServiceType="specialUse" />
            </application>
        </manifest>
        EOF

        # 7. Tạo colors.xml
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="gaming_bg">#0B0E14</color>
            <color name="gaming_card">#131B2E</color>
            <color name="neon_blue">#00F0FF</color>
            <color name="neon_purple">#B026FF</color>
            <color name="neon_green">#00FF66</color>
            <color name="text_white">#FFFFFF</color>
            <color name="text_gray">#8C9BA5</color>
        </resources>
        EOF

        # 8. Tạo themes.xml
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources xmlns:tools="http://schemas.android.com/tools">
            <style name="Theme.KryosFPSOverlay" parent="Theme.AppCompat.DayNight.NoActionBar">
                <item name="colorPrimary">@color/neon_purple</item>
                <item name="colorPrimaryDark">@color/gaming_bg</item>
                <item name="colorAccent">@color/neon_blue</item>
                <item name="android:windowBackground">@color/gaming_bg</item>
            </style>
        </resources>
        EOF

        # 9. Tạo strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Kryos FPS Overlay</string>
        </resources>
        EOF

        # 10. Tạo bg_gaming_card.xml
        cat << 'EOF' > app/src/main/res/drawable/bg_gaming_card.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="@color/gaming_card" />
            <corners android:radius="16dp" />
            <stroke android:width="1dp" android:color="@color/neon_purple" />
        </shape>
        EOF

        # 11. Tạo activity_main.xml
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent"
            android:background="@color/gaming_bg" android:padding="16dp">
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical">
                <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                    android:text="KRYOS FPS OVERLAY" android:textColor="@color/neon_blue"
                    android:textSize="22sp" android:textStyle="bold" android:gravity="center" android:layout_marginBottom="16dp" />
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                    android:background="@drawable/bg_gaming_card" android:orientation="vertical" android:padding="16dp" android:layout_marginBottom="12dp">
                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Trạng thái hoạt động" android:textColor="@color/text_white" android:textStyle="bold" android:textSize="16sp" />
                    <Switch android:id="@+id/switchOverlay" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Bật Overlay nổi" android:textColor="@color/neon_green" android:textSize="15sp" android:layout_marginTop="8dp" />
                    <Button android:id="@+id/btnHideController" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Ẩn giao diện này (Giữ Overlay)" android:backgroundTint="@color/neon_purple" android:textColor="@color/text_white" android:layout_marginTop="8dp" />
                </LinearLayout>
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                    android:background="@drawable/bg_gaming_card" android:orientation="vertical" android:padding="16dp" android:layout_marginBottom="12dp">
                    <Switch android:id="@+id/switchFps" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Hiển thị FPS" android:textColor="@color/neon_blue" android:textStyle="bold" android:textSize="16sp" android:checked="true" />
                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Màu chữ FPS:" android:textColor="@color/text_gray" android:layout_marginTop="8dp" />
                    <Spinner android:id="@+id/spinnerFpsColor" android:layout_width="match_parent" android:layout_height="48dp" android:backgroundTint="@color/neon_blue" />
                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Cỡ chữ FPS:" android:textColor="@color/text_gray" android:layout_marginTop="8dp" />
                    <SeekBar android:id="@+id/seekBarFpsSize" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="24" android:progress="14" android:layout_marginTop="4dp" />
                </LinearLayout>
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                    android:background="@drawable/bg_gaming_card" android:orientation="vertical" android:padding="16dp" android:layout_marginBottom="24dp">
                    <Switch android:id="@+id/switchText" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Hiển thị Text tùy chỉnh" android:textColor="@color/neon_purple" android:textStyle="bold" android:textSize="16sp" android:checked="true" />
                    <EditText android:id="@+id/edtCustomText" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Nhập nội dung chữ tùy chỉnh..." android:textColor="@color/text_white" android:textColorHint="@color/text_gray" android:text="Kryos Gaming" android:backgroundTint="@color/neon_purple" android:layout_marginTop="8dp" android:padding="8dp" />
                </LinearLayout>
            </LinearLayout>
        </ScrollView>
        EOF

        # 12. Tạo overlay_view.xml
        cat << 'EOF' > app/src/main/res/layout/overlay_view.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/rootOverlayLayout" android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:background="#990B0E14" android:orientation="vertical" android:padding="8dp" android:elevation="8dp">
            <TextView android:id="@+id/txtFps" android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="60 FPS" android:textColor="@color/neon_green" android:textSize="16sp" android:textStyle="bold"
                android:shadowColor="#000000" android:shadowDx="2" android:shadowDy="2" android:shadowRadius="3" />
            <TextView android:id="@+id/txtCustomText" android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="Kryos Gaming" android:textColor="@color/neon_blue" android:textSize="14sp"
                android:shadowColor="#000000" android:shadowDx="2" android:shadowDy="2" android:shadowRadius="3" android:layout_marginTop="2dp" />
        </LinearLayout>
        EOF

        # 13. Tạo MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/kryos/fpsoverlay/MainActivity.kt
        package com.kryos.fpsoverlay

        import android.content.Intent
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.view.View
        import android.widget.*
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            private lateinit var switchOverlay: Switch
            private lateinit var btnHideController: Button
            private lateinit var switchFps: Switch
            private lateinit var switchText: Switch
            private lateinit var edtCustomText: EditText
            private lateinit var spinnerFpsColor: Spinner
            private lateinit var seekBarFpsSize: SeekBar

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                switchOverlay = findViewById(R.id.switchOverlay)
                btnHideController = findViewById(R.id.btnHideController)
                switchFps = findViewById(R.id.switchFps)
                switchText = findViewById(R.id.switchText)
                edtCustomText = findViewById(R.id.edtCustomText)
                spinnerFpsColor = findViewById(R.id.spinnerFpsColor)
                seekBarFpsSize = findViewById(R.id.seekBarFpsSize)

                setupSpinners()

                switchOverlay.setOnCheckedChangeListener { _, isChecked ->
                    if (isChecked) {
                        if (!checkOverlayPermission()) {
                            requestOverlayPermission()
                            switchOverlay.isChecked = false
                        } else { startOverlayService() }
                    } else { stopService(Intent(this, OverlayService::class.java)) }
                }

                btnHideController.setOnClickListener { moveTaskToBack(true) }

                edtCustomText.addTextChangedListener(object : android.text.TextWatcher {
                    override fun afterTextChanged(s: android.text.Editable?) { sendConfigToService() }
                    override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                    override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                })
                switchFps.setOnCheckedChangeListener { _, _ -> sendConfigToService() }
                switchText.setOnCheckedChangeListener { _, _ -> sendConfigToService() }
                seekBarFpsSize.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) { sendConfigToService() }
                    override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                    override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                })
            }

            private fun setupSpinners() {
                val colors = arrayOf("Xanh Neon", "Đỏ", "Vàng", "Trắng", "Tím")
                spinnerFpsColor.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, colors)
                spinnerFpsColor.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                    override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) { sendConfigToService() }
                    override fun onNothingSelected(parent: AdapterView<*>?) {}
                }
            }

            private fun checkOverlayPermission(): Boolean {
                return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) Settings.canDrawOverlays(this) else true
            }

            private fun requestOverlayPermission() {
                val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                startActivityForResult(intent, 1001)
                Toast.makeText(this, "Vui lòng cấp quyền hiển thị trên ứng dụng khác", Toast.LENGTH_LONG).show()
            }

            private fun startOverlayService() {
                val intent = Intent(this, OverlayService::class.java).apply {
                    putExtra("fps_visible", switchFps.isChecked)
                    putExtra("text_visible", switchText.isChecked)
                    putExtra("custom_text", edtCustomText.text.toString())
                    putExtra("color_pos", spinnerFpsColor.selectedItemPosition)
                    putExtra("font_size", seekBarFpsSize.progress + 10f)
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
            }

            private fun sendConfigToService() { if (switchOverlay.isChecked) startOverlayService() }
        }
        EOF

        # 14. Tạo OverlayService.kt
        cat << 'EOF' > app/src/main/java/com/kryos/fpsoverlay/OverlayService.kt
        package com.kryos.fpsoverlay

        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.Service
        import android.content.Intent
        import android.graphics.Color
        import android.graphics.PixelFormat
        import android.os.Build
        import android.os.IBinder
        import android.view.*
        import android.widget.TextView

        class OverlayService : Service(), Choreographer.FrameCallback {
            private lateinit var windowManager: WindowManager
            private lateinit var overlayView: View
            private lateinit var txtFps: TextView
            private lateinit var txtCustomText: TextView
            private lateinit var params: WindowManager.LayoutParams
            private var lastFrameTimeNanos: Long = 0
            private var frameCount = 0
            private var lastFpsUpdate = 0L
            private var initialX = 0
            private var initialY = 0
            private var initialTouchX = 0f
            private var initialTouchY = 0f

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() {
                super.onCreate()
                startForegroundServiceNotification()
                initOverlayView()
                Choreographer.getInstance().postFrameCallback(this)
            }

            private fun startForegroundServiceNotification() {
                val channelId = "kryos_fps_channel"
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel(channelId, "Kryos FPS Overlay Service", NotificationManager.IMPORTANCE_LOW)
                    getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                }
                val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    Notification.Builder(this, channelId).setContentTitle("Kryos FPS đang chạy").setContentText("Đang hiển thị thông số FPS thời gian thực").setSmallIcon(android.R.drawable.ic_menu_info_details).build()
                } else {
                    Notification.Builder(this).setContentTitle("Kryos FPS đang chạy").setSmallIcon(android.R.drawable.ic_menu_info_details).build()
                }
                startForeground(1, notification)
            }

            private fun initOverlayView() {
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                overlayView = LayoutInflater.from(this).inflate(R.layout.overlay_view, null)
                txtFps = overlayView.findViewById(R.id.txtFps)
                txtCustomText = overlayView.findViewById(R.id.txtCustomText)

                val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                params = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, layoutType, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN, PixelFormat.TRANSLUCENT).apply {
                    gravity = Gravity.TOP or Gravity.START
                    x = 100; y = 100
   
