
name: Build FPS 120 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build FPS 120
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/*.apk output/FPS-120.apk

      - name: Upload FPS 120 APK
        uses: actions/upload-artifact@v4
        with:
          name: FPS-120
          path: output/FPS-120.apk
          
